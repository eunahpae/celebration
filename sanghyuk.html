<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사랑해요, 노상혁 💕</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, #ffe0ec 0%, #ffd1e3 45%, #ffb8d6 100%);
    overflow: hidden;
    position: relative;
  }

  .sparkle {
    position: absolute;
    bottom: -10%;
    font-size: 20px;
    opacity: 0.85;
    animation: float 6s linear infinite;
  }
  .sparkle:nth-child(1) { left: 6%;  animation-delay: 0s;   font-size: 16px; }
  .sparkle:nth-child(2) { left: 20%; animation-delay: 1.2s; font-size: 24px; }
  .sparkle:nth-child(3) { left: 80%; animation-delay: 0.6s; font-size: 18px; }
  .sparkle:nth-child(4) { left: 92%; animation-delay: 2s;   font-size: 22px; }
  .sparkle:nth-child(5) { left: 50%; animation-delay: 2.8s; font-size: 20px; }
  .sparkle:nth-child(6) { left: 65%; animation-delay: 1.6s; font-size: 16px; }
  @keyframes float {
    0%   { transform: translateY(0) rotate(0deg);   opacity: 0; }
    10%  { opacity: 0.9; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
  }

  .placard-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .placard {
    position: relative;
    width: min(88vw, 400px);
    background: #fffdfb;
    border-radius: 24px;
    padding: 40px 24px 34px;
    text-align: center;
    box-shadow: 0 24px 55px rgba(210, 60, 120, 0.3);
    border: 4px dashed #ff8fb4;
    animation: wiggle 3.2s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-1.2deg); }
    50%      { transform: rotate(1.2deg); }
  }

  .stick {
    width: 14px;
    height: 90px;
    background: linear-gradient(#e8b98f, #c98a54);
    border-radius: 0 0 8px 8px;
    margin-top: -6px;
    box-shadow: 2px 0 4px rgba(0,0,0,0.1);
  }

  .kya {
    font-size: clamp(22px, 6vw, 28px);
    font-weight: 800;
    color: #ff5c8d;
    margin: 0 0 6px;
  }

  .main-line {
    font-size: clamp(30px, 9vw, 44px);
    font-weight: 900;
    color: #e0357f;
    line-height: 1.3;
    margin: 8px 0;
    text-shadow: 2px 2px 0 #ffe1ec;
  }

  .sub-line {
    font-size: clamp(16px, 4.5vw, 20px);
    color: #b3457a;
    font-weight: 600;
    margin-top: 10px;
  }

  .hearts-row {
    margin-top: 16px;
    font-size: clamp(20px, 5vw, 26px);
  }
  .hearts-row span {
    display: inline-block;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .hearts-row span:nth-child(2) { animation-delay: 0.2s; }
  .hearts-row span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.25); }
  }
</style>
</head>
<body>

  <span class="sparkle">✨</span>
  <span class="sparkle">💗</span>
  <span class="sparkle">✨</span>
  <span class="sparkle">💕</span>
  <span class="sparkle">⭐</span>
  <span class="sparkle">💖</span>

  <div class="placard-wrap">
    <div class="placard">
      <div class="kya">꺄~~ 보고싶어요</div>
      <div class="main-line">사랑해요,<br>노상혁</div>
      <div class="sub-line">오늘도 응원해요 🐻💗</div>
      <div class="hearts-row"><span>💕</span><span>💖</span><span>💕</span></div>
    </div>
    <div class="stick"></div>
  </div>

</body>
</html>
