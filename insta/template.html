<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --accent:  {{ACCENT}};    /* 로고 시안 */
  --accent2: {{ACCENT2}};   /* 로고 마젠타 */
  --bg:      #080b16;       /* 로고 원 배경 */
  --ink:     #f2f5f8;
  --muted:   #7e8aa3;
  --line:    rgba(255, 255, 255, 0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1080px;
  height: 1350px;
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--ink);
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 65% 45% at 82% 4%, color-mix(in srgb, var(--accent) 16%, transparent) 0%, transparent 62%),
    radial-gradient(ellipse 65% 45% at 6% 98%, color-mix(in srgb, var(--accent2) 14%, transparent) 0%, transparent 62%),
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 90px 90px, 90px 90px;
  overflow: hidden;
}

.card {
  height: 100%;
  padding: 78px 76px 68px;
  display: flex;
  flex-direction: column;
  /* 남는 세로 공간을 블록 사이에 고르게 나눈다 —
     한 군데로 몰리면 카드가 비어 보인다 */
  justify-content: space-between;
}

/* ── 상단 kicker ────────────────────────────── */
.kicker {
  display: flex;
  align-items: center;
  gap: 20px;
}
/* 타입 배지 — 스킬 / 플러그인 / MCP / 설정 / 기본 */
.kicker .tag {
  flex: none;
  padding: 8px 18px 9px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  background: color-mix(in srgb, var(--accent) 15%, transparent);
  font-weight: 700;
  font-size: 23px;
  line-height: 1;
  color: var(--accent);
}
.kicker .name {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 25px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
}
.kicker::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 55%, transparent), color-mix(in srgb, var(--accent2) 30%, transparent) 60%, transparent);
}

/* ── 제목 ───────────────────────────────────── */
.title {
  font-weight: 900;
  font-size: 80px;
  line-height: 1.2;
  letter-spacing: -0.03em;
  word-break: keep-all;
}
.title em {
  font-style: normal;
  background: linear-gradient(102deg, var(--accent) 0%, var(--accent2) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.title.long { font-size: 66px; }

/* ── 리드 한 줄 ─────────────────────────────── */
.lead:empty { display: none; }
.lead {
  margin-top: 30px;
  font-size: 36px;
  line-height: 1.45;
  color: var(--muted);
  word-break: keep-all;
}

/* ── 본문 포인트 ────────────────────────────── */
.points {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 30px;
}
.points li {
  position: relative;
  padding-left: 42px;
  font-size: 40px;
  line-height: 1.45;
  color: #c9d2dc;
  word-break: keep-all;
}
.points li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 23px;
  width: 22px;
  height: 3px;
  background: var(--accent);
}

/* ── 명령어 블록 ────────────────────────────── */
.code {
  padding: 34px 36px;
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-left: 4px solid var(--accent);
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.035);
  font-family: 'JetBrains Mono', monospace;
  font-size: 29px;
  line-height: 1.65;
  color: #dfe6ee;
  white-space: pre-wrap;
  word-break: break-all;
}
.code .p { color: var(--accent); }
.code:empty { display: none; }

/* ── 하단 ───────────────────────────────────── */
.foot {
  padding-top: 38px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 27px;
  letter-spacing: 0.05em;
  color: var(--muted);
}
.foot .no {
  font-weight: 700;
  background: linear-gradient(102deg, var(--accent) 0%, var(--accent2) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
</style>
</head>
<body>
  <div class="card">
    <div class="kicker"><span class="tag">{{TYPE}}</span><span class="name">{{KICKER}}</span></div>
    <div class="head">
      <h1 class="title {{TITLE_CLASS}}">{{TITLE}}</h1>
      <p class="lead">{{LEAD}}</p>
    </div>
    <ul class="points">{{POINTS}}</ul>
    <div class="code">{{CODE}}</div>
    <div class="foot">
      <span>{{HANDLE}}</span>
      <span class="no">NO.{{INDEX}}</span>
    </div>
  </div>
</body>
</html>
