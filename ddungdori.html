<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뚱도리랑 샤브올데이 🍲</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, #fff3e4 0%, #ffe3d0 45%, #ffd6c9 100%);
    overflow: hidden;
    position: relative;
  }

  /* floating hearts */
  .heart {
    position: absolute;
    bottom: -10%;
    font-size: 22px;
    opacity: 0.85;
    animation: float 7s linear infinite;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.05));
  }
  .heart:nth-child(1) { left: 8%;  animation-delay: 0s;   font-size: 18px; }
  .heart:nth-child(2) { left: 22%; animation-delay: 1.5s; font-size: 26px; }
  .heart:nth-child(3) { left: 78%; animation-delay: 0.7s; font-size: 20px; }
  .heart:nth-child(4) { left: 90%; animation-delay: 2.3s; font-size: 16px; }
  .heart:nth-child(5) { left: 55%; animation-delay: 3.1s; font-size: 24px; }
  @keyframes float {
    0%   { transform: translateY(0) rotate(0deg);   opacity: 0; }
    10%  { opacity: 0.9; }
    90%  { opacity: 0.7; }
    100% { transform: translateY(-110vh) rotate(15deg); opacity: 0; }
  }

  .card {
    position: relative;
    width: min(90vw, 420px);
    background: #fffaf3;
    border-radius: 32px;
    padding: 36px 28px 30px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(190, 120, 80, 0.25);
    border: 3px solid #ffe6d5;
  }

  .title {
    font-size: clamp(20px, 5.5vw, 26px);
    font-weight: 800;
    color: #a85c3f;
    margin: 4px 0 4px;
    letter-spacing: -0.5px;
  }
  .sub {
    font-size: 14px;
    color: #c98a63;
    margin-bottom: 18px;
    font-weight: 600;
  }

  /* ddungdori the bear */
  .bear-wrap {
    position: relative;
    width: 190px;
    height: 190px;
    margin: 6px auto 14px;
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-8px) rotate(2deg); }
  }

  .ear {
    position: absolute;
    width: 46px; height: 46px;
    background: #c98a5a;
    border-radius: 50%;
    top: -6px;
  }
  .ear.left  { left: 6px; }
  .ear.right { right: 6px; }
  .ear::after {
    content: "";
    position: absolute;
    inset: 10px;
    background: #f3c9a3;
    border-radius: 50%;
  }

  .body {
    position: absolute;
    left: 50%;
    top: 26px;
    transform: translateX(-50%);
    width: 172px;
    height: 160px;
    background: #d99e6c;
    border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;
    box-shadow: inset 0 -14px 20px rgba(160, 95, 55, 0.25);
  }
  .belly {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    width: 108px;
    height: 96px;
    background: #f6d9b8;
    border-radius: 50%;
  }
  .cheek {
    position: absolute;
    width: 20px; height: 14px;
    background: #ffb6a0;
    border-radius: 50%;
    opacity: 0.8;
    top: 92px;
  }
  .cheek.left  { left: 30px; }
  .cheek.right { right: 30px; }

  .eye {
    position: absolute;
    width: 8px; height: 10px;
    background: #5a3520;
    border-radius: 50%;
    top: 72px;
  }
  .eye.left  { left: 62px; }
  .eye.right { right: 62px; }

  .snout {
    position: absolute;
    left: 50%;
    top: 82px;
    transform: translateX(-50%);
    width: 46px; height: 34px;
    background: #f6d9b8;
    border-radius: 50%;
  }
  .nose {
    position: absolute;
    left: 50%;
    top: 90px;
    transform: translateX(-50%);
    width: 14px; height: 10px;
    background: #5a3520;
    border-radius: 50%;
  }
  .mouth {
    position: absolute;
    left: 50%;
    top: 100px;
    transform: translateX(-50%);
    width: 18px; height: 9px;
    border-bottom: 3px solid #5a3520;
    border-radius: 0 0 50% 50%;
    border-left: none;
    border-right: none;
  }

  .arm {
    position: absolute;
    width: 30px; height: 46px;
    background: #d99e6c;
    border-radius: 20px;
    top: 96px;
  }
  .arm.left  { left: -6px;  transform: rotate(18deg); }
  .arm.right { right: -6px; transform: rotate(-18deg); }

  /* the pot */
  .pot-wrap {
    position: relative;
    width: 110px;
    margin: 4px auto 6px;
  }
  .steam {
    position: absolute;
    bottom: 46px;
    font-size: 20px;
    opacity: 0;
    animation: steamUp 2.6s ease-in infinite;
  }
  .steam.s1 { left: 14px; animation-delay: 0s; }
  .steam.s2 { left: 46px; animation-delay: 0.7s; }
  .steam.s3 { left: 76px; animation-delay: 1.4s; }
  @keyframes steamUp {
    0%   { transform: translateY(0) scale(0.8);   opacity: 0; }
    25%  { opacity: 0.8; }
    100% { transform: translateY(-34px) scale(1.2); opacity: 0; }
  }
  .pot {
    font-size: 46px;
    line-height: 1;
  }

  .msg {
    font-size: 15.5px;
    line-height: 1.65;
    color: #7a4a30;
    margin-top: 8px;
    font-weight: 600;
  }
  .msg b { color: #d0663c; }

  .tag {
    display: inline-block;
    margin-top: 18px;
    padding: 8px 18px;
    background: #ffdcc4;
    color: #a85c3f;
    font-size: 13px;
    font-weight: 700;
    border-radius: 999px;
  }
</style>
</head>
<body>

  <span class="heart">💗</span>
  <span class="heart">🧡</span>
  <span class="heart">💛</span>
  <span class="heart">💗</span>
  <span class="heart">🧡</span>

  <div class="card">
    <div class="title">뚱도리랑 샤브올데이 🐻🍲</div>
    <div class="sub">오늘은 얼른 가서 배 터지게 먹는 날!</div>

    <div class="bear-wrap">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="body">
        <div class="arm left"></div>
        <div class="arm right"></div>
        <div class="belly"></div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="snout"></div>
        <div class="nose"></div>
        <div class="mouth"></div>
      </div>
    </div>

    <div class="pot-wrap">
      <span class="steam s1">〰️</span>
      <span class="steam s2">〰️</span>
      <span class="steam s3">〰️</span>
      <div class="pot">🍲</div>
    </div>

    <div class="msg">
      뽀글뽀글 육수에<br>
      야채 팡팡, 고기 팡팡 넣고<br>
      <b>뚱뚱한 배</b>가 더 뚱뚱해지도록<br>
      맛있게 먹고 싶다는 뚱도리 마음 💕
    </div>

    <div class="tag">얼른 가자 샤브샤브 먹으러 🏃‍♀️💨</div>
  </div>

</body>
</html>
